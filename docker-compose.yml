name: apparel-pos

services:
  db:
    image: postgres:17-alpine
    # Throwaway local-only credentials; the port is not exposed beyond this machine.
    environment:
      POSTGRES_USER: pos
      POSTGRES_PASSWORD: pos
      POSTGRES_DB: pos
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pos -d pos']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
